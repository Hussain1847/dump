<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Feedback</title>
    <link rel="stylesheet" href="./Style.css">
</head>
<body>
    <div class="feedback-container">
        <div class="feedback-header">
            <h1>Session Feedback</h1>
            <p>Please rate your experience below</p>
        </div>

        <div class="stars">
            <span class="star">&#9733;</span>
            <span class="star">&#9733;</span>
            <span class="star">&#9733;</span>
            <span class="star">&#9733;</span>
            <span class="star">&#9734;</span>
            <span class="rating-count">(415 stars)</span>
        </div>

        <textarea placeholder="My feedback"></textarea>

        <button class="submit-btn">Submit Feedback</button>

        <div class="footer-buttons">
            <button class="home-btn">Home</button>
            <button class="session-btn">Rejoin Session</button>
        </div>
    </div>
</body>
</html>
