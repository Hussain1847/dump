<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f0f0;
      font-family: Arial, sans-serif;
    }
    .calculator {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
      width: 280px;
    }
    #result {
      width: 100%;
      height: 50px;
      text-align: right;
      font-size: 24px;
      margin-bottom: 15px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    button {
      padding: 20px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #f2f2f2;
    }
    button:hover {
      background: #ddd;
    }
    .equal {
      grid-column: span 2;
      background: #4CAF50;
      color: #fff;
    }
    .equal:hover {
      background: #45a049;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <input type="text" id="result" disabled>
    <div class="buttons">
      <button onclick="clearResult()">C</button>
      <button onclick="deleteChar()">⌫</button>
      <button onclick="append('%')">%</button>
      <button onclick="append('/')">÷</button>
      
      <button onclick="append('7')">7</button>
      <button onclick="append('8')">8</button>
      <button onclick="append('9')">9</button>
      <button onclick="append('*')">×</button>
      
      <button onclick="append('4')">4</button>
      <button onclick="append('5')">5</button>
      <button onclick="append('6')">6</button>
      <button onclick="append('-')">−</button>
      
      <button onclick="append('1')">1</button>
      <button onclick="append('2')">2</button>
      <button onclick="append('3')">3</button>
      <button onclick="append('+')">+</button>
      
      <button onclick="append('0')">0</button>
      <button onclick="append('.')">.</button>
      <button class="equal" onclick="calculate()">=</button>
        
    </div>\n  </div>\n\n  <script>\n    function append(value) {\n      document.getElementById(\"result\").value += value;\n    }\n\n    function clearResult() {\n      document.getElementById(\"result\").value = \"\";\n    }\n\n    function deleteChar() {\n      let current = document.getElementById(\"result\").value;\n      document.getElementById(\"result\").value = current.slice(0, -1);\n    }\n\n    function calculate() {\n      try {\n        let output = eval(document.getElementById(\"result\").value);\n        document.getElementById(\"result\").value = output;\n      } catch (e) {\n        alert(\"Invalid Expression\");\n      }\n    }\n  </script>\n</body>\n</html>\n```\n\n👉 Copy-paste this into a file called **`calculator.html`** and open it in your browser.
