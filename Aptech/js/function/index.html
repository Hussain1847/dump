        //practice qs in which it will print vowels from any word
        function countVowels(str) {
            let count = 0;
            for (const char of str) {
                if (char === "a" ||
                    char === "e" ||
                    char === "i" ||
                    char === "o" ||
                    char === "u") {
                    count++;
                }
            }
            console.log(count);
        }

        countVowels("apna college")
