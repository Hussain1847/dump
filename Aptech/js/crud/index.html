<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Web App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #333;
        }

        input,
        button {
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            cursor: pointer;
        }

        button.add {
            background: #28a745;
            color: white;
            border: none;
        }

        button.edit {
            background: #007bff;
            color: white;
            border: none;
        }

        button.delete {
            background: #dc3545;
            color: white;
            border: none;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            padding: 10px;
            margin: 5px 0;
            background: #f9f9f9;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .actions button {
            margin-left: 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>CRUD Web App</h2>
        <input type="text" id="itemInput" placeholder="Enter item">
        <button class="add" onclick="addItem()">Add</button>

        <ul id="itemList"></ul>
    </div>

    <script>
        let items = [];
        let editIndex = null;

        function addItem() {
            const input = document.getElementById("itemInput");
            const value = input.value.trim();

            if (value === "") {
                alert("Please enter something!");
                return;
            }

            if (editIndex === null) {
                // Create
                items.push(value);
            } else {
                // Update
                items[editIndex] = value;
                editIndex = null;
            }

            input.value = "";
            displayItems();
        }

        function displayItems() {
            const list = document.getElementById("itemList");
            list.innerHTML = "";

            items.forEach((item, index) => {
                list.innerHTML += `
          <li>
            ${item}
            <span class="actions">
              <button class="edit" onclick="editItem(${index})">Edit</button>
              <button class="delete" onclick="deleteItem(${index})">Delete</button>
            </span>
          </li>
        `;
            });
        }

        function editItem(index) {
            document.getElementById("itemInput").value = items[index];
            editIndex = index;
        }

        function deleteItem(index) {
            items.splice(index, 1);
            displayItems();
        }
    </script>
</body>

</html>
